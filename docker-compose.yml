services:
  vio:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      VIO_HOST: "0.0.0.0"
      VIO_PORT: "8787"
      VIO_DATA_DIR: /data
      VIO_KEYMASTER_URL: http://host.docker.internal:8660
    volumes:
      - vio-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vio-data:
